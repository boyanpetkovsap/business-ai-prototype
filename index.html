<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440" />
<title>Business AI 360 – SAP for Me</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f6f7;
    --white: #ffffff;
    --brand: #0070f2;
    --link: #0064d9;
    --text: #1d2d3e;
    --text2: #131e29;
    --label: #556b82;
    --border: #e5e5e5;
    --border2: #d9d9d9;
    --group-border: #a8b3bd;
    --positive: #256f3a;
    --info-bg: #e1f4ff;
    --info-border: #7bcfff;
    --c-blue: #168eff;
    --c-orange: #c87b00;
    --c-olive: #75980b;
    --c-pink: #df1278;
    --c-purple: #8b47d7;
    --c-teal: #049f9a;
    --green: #256f3a;
    --green-light: #36a41d;
    --red: #bb0000;
    --badge: #aa0808;
    --shell-interactive: #eff1f2;
    --field-border: #8a97a4;
    --amber-hl: #fcf2d6;
    --teal-hl: #e3f8ef;
    --hover: #f2f6fb;
    --sel-bg: #ebf5ff;
  }

  html, body { height: 100%; }
  body {
    font-family: "72", "72override", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text2);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.3;
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; cursor: pointer; }
  a { color: var(--link); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }

  /* ===== Shell bar ===== */
  .shellbar {
    height: 44px;
    background: var(--white);
    border-bottom: 1px solid var(--border2);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    position: sticky; top: 0; z-index: 50;
    box-shadow: 0 2px 2px #556b821a;
  }
  .shellbar .logo {
    width: 44px; height: 22px; background: var(--brand);
    border-radius: 3px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: 13px; letter-spacing: .5px;
    transform: skewX(-10deg);
  }
  .shellbar .logo span { transform: skewX(10deg); }
  .shellbar .product { font-weight: 700; color: var(--text); font-size: 15px; }
  .shellbar .search {
    flex: 1; max-width: 560px; margin: 0 auto; position: relative;
  }
  .shellbar .search input {
    width: 100%; height: 30px; border-radius: 16px; border: 1px solid transparent;
    background: var(--shell-interactive); padding: 0 36px 0 16px; font-size: 13px; color: var(--text);
  }
  .shellbar .search input::placeholder { color: var(--label); }
  .shellbar .search .s-icon { position: absolute; right: 12px; top: 7px; color: var(--label); }
  .shell-right { display: flex; align-items: center; gap: 14px; margin-left: auto; }
  .shell-right .explore { color: var(--text); font-size: 13px; }
  .shell-btn { position: relative; color: var(--text); background: none; border: none; padding: 4px; border-radius: 6px; display: flex; }
  .shell-btn:hover { background: var(--shell-interactive); }
  .badge {
    position: absolute; top: -6px; right: -8px; background: var(--badge); color: #fff;
    border-radius: 10px; font-size: 10px; font-weight: 700; padding: 1px 5px; min-width: 18px; text-align: center;
  }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#8a6f5a,#5c4733); overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* ===== Body layout ===== */
  .body { display: flex; min-height: calc(100vh - 44px); }
  .nav {
    width: 208px; flex: 0 0 208px; background: var(--white); border-right: 1px solid var(--border2);
    display: flex; flex-direction: column; padding: 8px 0; position: sticky; top: 44px; height: calc(100vh - 44px);
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 8px 16px; color: var(--text); font-size: 13px;
    cursor: pointer; position: relative; border: none; background: none; width: 100%; text-align: left; font-weight: 600;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { background: var(--sel-bg); }
  .nav-item.active::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; background: var(--brand); border-radius: 0 2px 2px 0; }
  .nav-item .dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }
  .nav-section { padding: 14px 16px 4px; font-size: 11px; color: var(--label); font-weight: 400; }
  .nav-spacer { flex: 1; }
  .nav-item .chev-r { margin-left: auto; color: var(--label); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ===== Page header ===== */
  .page-header {
    background: var(--white); padding: 14px 32px 0; border-bottom: 1px solid var(--border);
  }
  .ph-top { display: flex; align-items: center; gap: 12px; }
  .ph-title { font-size: 22px; font-weight: 800; color: var(--text); }
  .ph-sep { color: var(--border2); font-weight: 300; }
  .company-select {
    display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); font-weight: 400;
    background: none; border: none; padding: 4px 6px; border-radius: 6px;
  }
  .company-select:hover { background: var(--hover); }
  .company-select .under { border-bottom: 1px solid var(--border2); padding-bottom: 2px; }
  .ph-assist { margin-left: auto; }
  .btn-ghost-outline {
    border: 1px solid var(--link); color: var(--link); background: var(--white); border-radius: 8px;
    height: 30px; padding: 0 14px; font-size: 13px; font-weight: 600;
  }
  .btn-ghost-outline:hover { background: #f0f7ff; }

  .tabs { display: flex; gap: 26px; margin-top: 14px; }
  .tab {
    padding: 10px 0 12px; font-size: 14px; color: #475e75; font-weight: 600; background: none; border: none;
    border-bottom: 3px solid transparent; position: relative; top: 1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--brand); border-bottom-color: var(--brand); }
  .tab.disabled { color: #8a97a4; cursor: default; }
  .tab.disabled:hover { color: #8a97a4; }

  /* ===== Content ===== */
  .content { padding: 20px 32px 48px; }
  .content-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 14px; }

  .card {
    background: var(--white); border-radius: 12px; box-shadow: 0 2px 4px #22364922, 0 0 2px #22364922;
    overflow: hidden;
  }
  .card-pad { padding: 16px 20px; }

  /* toolbar */
  .toolbar { display: flex; align-items: center; gap: 14px; padding: 8px 16px; min-height: 52px; }
  .toolbar .count { font-size: 15px; font-weight: 700; color: var(--text); }
  .toolbar .count span { color: var(--label); font-weight: 400; }
  .view-switch { display: inline-flex; align-items: center; gap: 4px; color: var(--link); font-weight: 600; font-size: 14px; background: none; border: none; }
  .subtabs { display: flex; gap: 20px; margin-left: 10px; }
  .subtab { font-size: 14px; font-weight: 600; color: #475e75; background: none; border: none; padding: 4px 0 8px; border-bottom: 2px solid transparent; }
  .subtab.active { color: var(--link); border-bottom-color: var(--link); }
  .spacer { flex: 1; }
  .toolbar-search { position: relative; width: 300px; }
  .toolbar-search input { width: 100%; height: 30px; border-radius: 16px; border: 1px solid var(--field-border); background: var(--white); padding: 0 34px 0 14px; font-size: 13px; }
  .toolbar-search .s-icon { position: absolute; right: 10px; top: 7px; color: var(--label); }
  .icon-btn { background: none; border: none; color: var(--link); padding: 6px; border-radius: 6px; display: inline-flex; }
  .icon-btn:hover { background: #eef5fe; }
  .icon-btn.split { padding-right: 2px; }
  .split-group { display: inline-flex; align-items: center; }
  .split-sep { width: 1px; height: 18px; background: var(--border2); margin: 0 2px; }
  .select-sm {
    height: 30px; border: 1px solid var(--field-border); border-radius: 6px; background: var(--white);
    padding: 0 30px 0 12px; font-size: 13px; color: var(--text); font-weight: 600;
    appearance: none; position: relative; min-width: 150px;
  }
  .select-wrap { position: relative; display: inline-block; }
  .select-wrap .caret { position: absolute; right: 10px; top: 9px; pointer-events: none; color: var(--text); }

  /* tables */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 13px; font-weight: 700; color: var(--text); padding: 8px 12px;
    border-bottom: 1px solid var(--group-border); white-space: nowrap;
  }
  tbody td { padding: 7px 12px; font-size: 13px; color: var(--text2); border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:hover { background: var(--hover); }
  .num { text-align: right; white-space: nowrap; }
  .num b { font-weight: 700; color: var(--text2); }
  .unit { color: var(--label); font-weight: 400; }
  .row-total td { font-weight: 700; border-bottom: 1px solid var(--group-border); }
  .grand-total td { font-weight: 700; background: #fafbfc; border-top: 1px solid var(--group-border); border-bottom: none; }

  /* tree table */
  .tree-group td { background: #fff; }
  .tree-group-row td { border-bottom: 1px solid var(--border); }
  .chev-btn { background: none; border: none; padding: 2px; color: var(--label); display: inline-flex; vertical-align: middle; }
  .cell-tree { display: flex; align-items: center; gap: 6px; }
  .pupm { display: inline-block; border: 1px solid var(--link); color: var(--link); border-radius: 10px; font-size: 10px; font-weight: 700; padding: 1px 7px; margin-left: 8px; }
  .ext-link { visibility: hidden; color: var(--link); }
  tbody tr:hover .ext-link { visibility: visible; }
  .hl-amber td { background: var(--amber-hl) !important; }
  .hl-teal td { background: var(--teal-hl) !important; }

  /* status / activation */
  .status-activated { color: var(--positive); font-weight: 600; }
  .btn-req { border: 1px solid var(--link); color: var(--link); background: #fff; border-radius: 8px; height: 26px; padding: 0 12px; font-size: 12px; font-weight: 600; }
  .btn-req:hover { background: #f0f7ff; }
  .btn-req:disabled { border-color: #c6cdd4; color: #b0b8c0; background: #fff; cursor: default; }
  .group-header-row td { background: #f2f3f5; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--border); padding: 7px 12px; }
  .msg-strip { display: flex; align-items: center; gap: 10px; background: var(--info-bg); border: 1px solid var(--info-border); border-radius: 8px; padding: 9px 12px; font-size: 13px; color: var(--text2); }
  .msg-strip .i { color: var(--brand); display: flex; }
  .terms-panel { border: 1px solid var(--border2); border-radius: 12px; background: #fff; overflow: hidden; }
  .terms-head { padding: 12px 20px; font-weight: 700; color: var(--text); font-size: 15px; border-bottom: 1px solid var(--border); }
  .terms-body { padding: 16px 20px; color: var(--text2); }
  .terms-foot { padding: 12px 20px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border); }
  .btn-primary { background: var(--link); color: #fff; border: none; border-radius: 8px; height: 32px; padding: 0 16px; font-size: 13px; font-weight: 600; }
  .btn-primary:hover { background: #0054b8; }
  .btn-transparent { background: none; border: none; color: var(--link); font-weight: 600; font-size: 13px; padding: 0 12px; }
  .btn-transparent:hover { text-decoration: underline; }

  /* cards grid (overview) */
  .ov-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .ov-col { display: flex; flex-direction: column; gap: 16px; }
  .card-head { display: flex; align-items: flex-start; padding: 16px 20px 10px; }
  .card-head .ct { font-weight: 700; color: var(--text); font-size: 15px; }
  .card-head .cs { color: var(--label); font-size: 12px; margin-top: 2px; }
  .card-head .acts { margin-left: auto; display: flex; gap: 6px; color: var(--link); }
  .num-header { padding: 0 20px 10px; }
  .num-big { font-size: 34px; font-weight: 400; color: var(--c-blue); letter-spacing: -0.5px; }
  .num-cap { font-size: 13px; font-weight: 700; color: var(--link); margin-left: 8px; }
  .divider { height: 1px; background: var(--border); margin: 4px 0; }
  .legend { display: flex; gap: 20px; padding: 10px 20px 4px; font-size: 12px; color: var(--text2); }
  .legend .li { display: flex; align-items: center; gap: 6px; }
  .legend .mk { width: 22px; height: 0; border-top: 3px solid; }

  .pkg-list .pk-head { font-weight: 700; color: var(--text); font-size: 13px; padding: 12px 20px 4px; }
  .pkg-list .pk-item { padding: 10px 20px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text2); }
  .pkg-list .pk-item:first-of-type { border-top: 1px solid var(--border); }

  .ql-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: var(--link); font-size: 13px; border-bottom: 1px solid var(--border); }
  .ql-item:last-child { border-bottom: none; }

  .entit-foot { display: flex; gap: 40px; padding: 10px 20px 16px; font-size: 13px; }
  .entit-foot b { font-weight: 700; color: var(--text); }
  .entit-foot .lbl { color: var(--label); margin-left: 6px; }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(10,20,30,.45); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding-top: 70px; }
  .modal { background: #fff; border-radius: 12px; width: 1180px; max-width: 94vw; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 16px 40px rgba(0,0,0,.3); overflow: hidden; }
  .modal-close { margin-left: auto; }
  .segmented { display: inline-flex; border: 1px solid var(--link); border-radius: 8px; overflow: hidden; }
  .segmented button { background: #fff; border: none; color: var(--link); font-size: 12px; font-weight: 600; padding: 4px 12px; border-right: 1px solid var(--link); }
  .segmented button:last-child { border-right: none; }
  .segmented button.active { background: var(--link); color: #fff; }
  .modal-body { overflow: auto; }
  .ghost-row td { color: #8a97a4 !important; }
  .ghost-row td b { color: #8a97a4 !important; }

  .table-wrap { overflow-x: auto; }
  .table-wrap.balance table { min-width: 1240px; }
  .pdf-btn { border: 1px solid var(--border2); border-radius: 6px; background: #fff; color: var(--red); font-size: 9px; font-weight: 700; padding: 3px 6px; display: inline-flex; align-items: center; gap: 3px; }
  .pdf-btn:hover { background: #fafafa; }

  .info-i { color: var(--brand); display: inline-flex; vertical-align: middle; margin-left: 4px; }
  .link-cell { color: var(--link); cursor: pointer; }
  .link-cell:hover { text-decoration: underline; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--link); font-weight: 600; font-size: 14px; background: none; border: none; }
</style>
</head>

/* ================= OVERVIEW ================= */
function LineChart() {
  const W = 1360, H = 230, padL = 48, padR = 20, padT = 14, padB = 40;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxY = 60000;
  const xs = [0, 0.18, 0.40, 0.62, 0.82, 1].map(f => padL + f * plotW);
  const labels = [null, "May\n2026", "June\n2026", "July\n2026", "August\n2026", null];
  const monthFull = [null, "May 2026", "June 2026", "July 2026", "August 2026", null];
  const Y = v => padT + plotH - (v / maxY) * plotH;
  const series = [
    { key:"bulgaria", name:"Bosch Bulgaria", color: "#8b47d7", dash: false, pts: [0, 20000, 38000, 33000, 50000, 50000] },
    { key:"germany", name:"Bosch Germany", color: "#c87b00", dash: false, pts: [0, 7000, 30000, 10000, 17000, 17000] },
    { key:"romania", name:"Bosch Romania", color: "#049f9a", dash: true, pts: [0, 38000, 50000, 40000, 33000, 33000] },
  ];
  const grid = [0, 10000, 20000, 30000, 40000, 50000, 60000];
  const [hover, setHover] = useState(null); // {si, pi}
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%', height:'auto'}}>
      {grid.map((g,i) => (
        <g key={i}>
          <line x1={padL} x2={W-padR} y1={Y(g)} y2={Y(g)} stroke="#eceef0" strokeWidth="1" />
          <text x={padL-8} y={Y(g)+4} textAnchor="end" fontSize="11" fill="var(--label)">{g.toLocaleString()}</text>
        </g>
      ))}
      <line x1={padL} x2={padL} y1={padT} y2={padT+plotH} stroke="#d9d9d9" strokeWidth="1" />
      {series.map(s => (
        <polyline key={s.key} fill="none" stroke={s.color} strokeWidth="2"
          strokeDasharray={s.dash ? "6 4" : "0"}
          points={s.pts.map((v,i)=>`${xs[i]},${Y(v)}`).join(" ")} />
      ))}
      {series.map((s,si) => s.pts.map((v,pi)=> (pi>0 && pi<5) ? (
        <g key={s.key+pi}>
          <circle cx={xs[pi]} cy={Y(v)} r={hover && hover.si===si && hover.pi===pi ? 4.5 : 3} fill={s.color} />
          <circle cx={xs[pi]} cy={Y(v)} r="9" fill="transparent" style={{cursor:'pointer'}}
            onMouseEnter={()=>setHover({si,pi})} onMouseLeave={()=>setHover(null)} />
        </g>
      ) : null))}
      {labels.map((l,i)=> l ? l.split("\n").map((ln,j)=>(
        <text key={i+'-'+j} x={xs[i]} y={padT+plotH+16+j*13} textAnchor="middle" fontSize="11" fill="var(--label)">{ln}</text>
      )) : null)}
      {hover && (()=>{
        const s = series[hover.si]; const v = s.pts[hover.pi];
        const cx = xs[hover.pi], cy = Y(v);
        const l1 = s.name + " · " + monthFull[hover.pi];
        const l2 = v.toLocaleString() + " AI Units Consumed";
        const tw = Math.max(l1.length, l2.length) * 6.2 + 22;
        let left = cx - tw/2; left = Math.max(2, Math.min(left, W - 2 - tw));
        const bh = 38, ty = cy - 12;
        return (
          <g pointerEvents="none">
            <rect x={left} y={ty-bh} width={tw} height={bh} rx="5" fill="#1d2d3e" />
            <circle cx={left+13} cy={ty-bh+13} r="4" fill={s.color} />
            <text x={left+tw/2+6} y={ty-bh+14} textAnchor="middle" fontSize="11" fill="#ffffff" fontWeight="600">{l1}</text>
            <text x={left+tw/2} y={ty-bh+30} textAnchor="middle" fontSize="11" fill="#dfe7ef">{l2}</text>
            <path d={`M${cx-5},${ty} L${cx+5},${ty} L${cx},${ty+5} Z`} fill="#1d2d3e" />
          </g>
        );
      })()}
    </svg>
  );
}

function EntitlementChart() {
  const W = 600, H = 300, baseY = 250;
  const GREEN = "#256f3a", RED = "#aa0808", BLACK = "#1d2d3e";
  const gl = [{v:"0",y:250},{v:"1M",y:212},{v:"3M",y:150},{v:"7M",y:54}];
  // Vertical bullet chart: green = consumed (actual bar), red = overage band, black line = Total AI Units (target)
  const bars = [
    { id:"740116977", x:170, greenTop:212, red:{top:194,bottom:210}, black:210,
      consumed:"1,000,000", overage:"500,000", total:"1,000,000" },
    { id:"740174122", x:300, greenTop:80, red:null, black:78,
      consumed:"6,000,000", total:"6,000,000" },
    { id:"740407676", x:430, greenTop:206, red:null, black:162,
      consumed:"1,000,000", total:"2,500,000" },
  ];
  const bw = 44;
  const [hover, setHover] = useState(null); // {bi, seg}
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%', height:'auto'}}>
      {gl.map(g=>(
        <g key={g.v}>
          <line x1="44" x2={W-10} y1={g.y} y2={g.y} stroke="#eceef0" />
          <text x="36" y={g.y+4} textAnchor="end" fontSize="11" fill="var(--label)">{g.v}</text>
        </g>
      ))}
      {bars.map((b,bi)=>(
        <g key={b.id}>
          {/* green: consumed */}
          <rect x={b.x-bw/2} y={b.greenTop} width={bw} height={baseY-b.greenTop} fill={GREEN}
            style={{cursor:'pointer'}} onMouseEnter={()=>setHover({bi,seg:"green"})} onMouseLeave={()=>setHover(null)} />
          {/* red: overage */}
          {b.red && <rect x={b.x-bw/2} y={b.red.top} width={bw} height={b.red.bottom-b.red.top} fill={RED}
            style={{cursor:'pointer'}} onMouseEnter={()=>setHover({bi,seg:"red"})} onMouseLeave={()=>setHover(null)} />}
          {/* black line: total (target) */}
          <rect x={b.x-bw/2-4} y={b.black} width={bw+8} height="4" fill={BLACK} />
          <rect x={b.x-bw/2-4} y={b.black-5} width={bw+8} height="14" fill="transparent"
            style={{cursor:'pointer'}} onMouseEnter={()=>setHover({bi,seg:"black"})} onMouseLeave={()=>setHover(null)} />
          <text x={b.x} y={baseY+16} textAnchor="middle" fontSize="11" fill="var(--label)">Contract ID:</text>
          <text x={b.x} y={baseY+29} textAnchor="middle" fontSize="11" fill="var(--text2)" fontWeight="600">{b.id}</text>
        </g>
      ))}
      {hover && (()=>{
        const b = bars[hover.bi];
        const seg = hover.seg;
        const info = seg==="green" ? { y:b.greenTop, t:b.consumed+" AI Units Consumed" }
                   : seg==="red" ? { y:b.red.top, t:b.overage+" AI Units Overage" }
                   : { y:b.black, t:b.total+" Total AI Units" };
        const tw = info.t.length*6.1 + 22, bh = 22;
        let left = b.x - tw/2; left = Math.max(44, Math.min(left, W-10-tw));
        const ty = info.y - 8;
        return (
          <g pointerEvents="none">
            <rect x={left} y={ty-bh} width={tw} height={bh} rx="4" fill="#1d2d3e" />
            <text x={left+tw/2} y={ty-bh/2+4} textAnchor="middle" fontSize="11" fill="#ffffff" fontWeight="600">{info.t}</text>
            <path d={`M${b.x-5},${ty} L${b.x+5},${ty} L${b.x},${ty+5} Z`} fill="#1d2d3e" />
          </g>
        );
      })()}
    </svg>
  );
}

function TreeRows({ nodes, view, level, open, toggle, path }) {
  const cols = view === "price" ? 5 : 4;
  const rows = [];
  nodes.forEach((n, idx) => {
    const key = path + "/" + idx;
    if (n.type === "group") {
      const isOpen = open[key] !== false;
      const hlClass = n.highlight === "amber" ? "hl-amber" : n.highlight === "teal" ? "hl-teal" : "";
      rows.push(
        <tr key={key} className={"tree-group-row " + hlClass}>
          <td colSpan={cols}>
            <span className="cell-tree" style={{paddingLeft: level*22}}>
              <button className="chev-btn" onClick={()=>toggle(key, isOpen)}>{isOpen?I.chevDown:I.chevRight}</button>
              {n.label}
            </span>
          </td>
        </tr>
      );
      if (isOpen) {
        rows.push(...TreeRows({ nodes:n.children, view, level:level+1, open, toggle, path:key }));
        if (n.total) {
          rows.push(
            <tr key={key+"-total"} className="row-total">
              <td style={{paddingLeft: (level+1)*22 + 24}}>Total</td>
              {view==="price" && <td></td>}
              <td>{n.total.usage ? <b>{n.total.usage}</b> : ""}</td>
              <td></td>
              <td><b>{n.total.charging}</b></td>
            </tr>
          );
        }
      }
    } else {
      rows.push(
        <tr key={key}>
          <td>
            <span className="cell-tree" style={{paddingLeft: level*22 + 24}}>
              {n.label}
              {n.pupm && <span className="pupm">PUPM</span>}
            </span>
          </td>
          {view==="price" && <td>{n.assistant}</td>}
          <td>{n.usage}</td>
          <td style={{position:'relative'}}>
            {n.metric}
            {n.link && <span className="ext-link" style={{position:'absolute', right:12, top:7}}>{I.ext}</span>}
          </td>
          <td>{n.charging}</td>
        </tr>
      );
    }
  });
  return rows;
}

    if (r.kind === "base") return termsAccepted ? "activated" : "base-disabled";
    return r.kind;
